# Render Blueprint — free web service for Yanxi
# https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect lixiaowww/yanxi
# Or: New → Web Service → same build/start commands below.

services:
  - type: web
    name: yanxi
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COLLECT_API_TOKEN
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: YANXI_AUDIT
        value: "0"
