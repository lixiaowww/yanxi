# Render Blueprint — free web service for Yanxi
# https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect lixiaowww/yanxi
# Or: New → Web Service → same build/start commands below.

services:
  - type: web
    name: yanxi
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COLLECT_API_TOKEN
        generateValue: true
      # /api/brief is open when LLM_API_KEY is set; per-IP rate limit only.

      - key: BRIEF_RATE_MAX
        value: "20"
      - key: BRIEF_RATE_WINDOW_MS
        value: "600000"
      # Render puts exactly one proxy hop in front of the app.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LLM_API_KEY
        sync: false
      - key: YANXI_AUDIT
        value: "0"
